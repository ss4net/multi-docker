name: React Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: docker build -t test-client -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true test-client npm test
