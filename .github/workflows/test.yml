name: React Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: docker build -t test-client -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true test-client npm test

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build client image
        run: docker build -t ss4net1/multi-client ./client
      - name: Push client image
        run: docker push ss4net1/multi-client

      - name: Build nginx image
        run: docker build -t ss4net1/multi-nginx ./nginx
      - name: Push nginx image
        run: docker push ss4net1/multi-nginx

      - name: Build server image
        run: docker build -t ss4net1/multi-server ./server
      - name: Push server image  
        run: docker push ss4net1/multi-server

      - name: Build worker image
        run: docker build -t ss4net1/multi-worker ./worker
      - name: Push worker image
        run: docker push ss4net1/multi-worker

      - name: Generate deployment package
        run: |
          cp docker-compose-eb.yml docker-compose.yml
          zip -r deploy.zip docker-compose.yml

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: multi-docker
          environment_name: Multi-docker-env
          region: us-east-1
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
