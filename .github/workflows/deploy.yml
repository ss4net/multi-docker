name: Deploy Multi-Docker to AWS
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Images
        run: |
          docker build -t ss4net1/multi-client:${{ github.sha }} ./client
          docker build -t ss4net1/multi-server:${{ github.sha }} ./server
          docker build -t ss4net1/multi-worker:${{ github.sha }} ./worker
          docker build -t ss4net1/multi-nginx:${{ github.sha }} ./nginx
          
          docker push ss4net1/multi-client:${{ github.sha }}
          docker push ss4net1/multi-server:${{ github.sha }}
          docker push ss4net1/multi-worker:${{ github.sha }}
          docker push ss4net1/multi-nginx:${{ github.sha }}

      - name: Inject Real Tag into docker-compose.yml
        run: sed -i "s/tagname/${{ github.sha }}/g" docker-compose.yml

      - name: Generate Deployment Package
        run: zip deploy.zip docker-compose.yml

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: multi-docker
          environment_name: Multi-docker-env
          version_label: ${{ github.sha }}
          region: ap-northeast-1 
          deployment_package: deploy.zip