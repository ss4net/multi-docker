version: '3'

services:
    nginx:
      restart: always
      build:
        context: ./nginx
        dockerfile: Dockerfile.dev
      ports:
        - "3030:80"
    posgress:
        image: 'postgres:9'
    redis:    
      image: 'redis:latest'
    api:
      build: 
        context: ./server
        dockerfile: Dockerfile.dev
      ports:
        - "5000:5000"
      volumes: 
        - ./server:/app
        - /app/node_modules
      environment:
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - PGHOST=postgres
        - PGPORT=5432
        - PGDATABASE=postgres
        - PGUSER=postgres
        - PGPASSWORD=[PASSWORD]
        
    client:
      build:
        context: ./client
        dockerfile: Dockerfile.dev
      ports:
        - "3000:3000"
      volumes:
        - ./client:/app
        - /app/node_modules

    worker:
      build:
        context: ./worker
        dockerfile: Dockerfile.dev
      volumes:
        - ./worker:/app
        - /app/node_modules
      
        